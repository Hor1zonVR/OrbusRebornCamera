name: Validate Replay Buffer Ring

on:
  push:
    paths:
      - 'OrbusRebornCamera/ReplayRingBuffer.cs'
      - 'tests/ReplayRingBuffer.CompileTest.csproj'
      - 'tests/ReplayBuffer.IntegrationCompileTest.csproj'
      - 'OrbusRebornCamera/ReplayBufferRecorder.cs'
      - 'OrbusRebornCamera/CameraDiagnostics.Recording.cs'
      - 'tests/ReplayBuffer.IntegrationCompileTest.csproj'
      - 'OrbusRebornCamera/ReplayBufferRecorder.cs'
      - 'OrbusRebornCamera/CameraDiagnostics.Recording.cs'
      - 'tests/replay-buffer/**'
      - '.github/workflows/test-replay-buffer.yml'
  pull_request:
    paths:
      - 'OrbusRebornCamera/ReplayRingBuffer.cs'
      - 'tests/ReplayRingBuffer.CompileTest.csproj'
      - 'tests/replay-buffer/**'
      - '.github/workflows/test-replay-buffer.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Run ring buffer tests (no game binaries required)
        run: |
          dotnet run --project tests/ReplayRingBuffer.CompileTest.csproj -c Release
          dotnet run --project tests/ReplayBuffer.IntegrationCompileTest.csproj -c Release
