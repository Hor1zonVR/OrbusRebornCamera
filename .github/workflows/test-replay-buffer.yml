name: Validate Replay Buffer Ring

on:
  push:
    paths:
      - 'OrbusRebornCamera/ReplayRingBuffer.cs'
      - 'OrbusRebornCamera/ReplayBufferRecorder.cs'
      - 'OrbusRebornCamera/NearbyWorldActorCapture.cs'
      - 'OrbusRebornCamera/WorldActorRecords.cs'
      - 'OrbusRebornCamera/WorldRigData.cs'
      - 'OrbusRebornCamera/WorldRigCapture.cs'
      - 'tests/WorldRigTimeline.CompileTest.csproj'
      - 'tests/world-rigs/**'
      - 'OrbusRebornCamera/CameraDiagnostics.WorldActors.cs'
      - 'tests/WorldActorTimeline.CompileTest.csproj'
      - 'tests/world-actors/**'
      - 'OrbusRebornCamera/LocalAvatarCapture.cs'
      - 'OrbusRebornCamera/CameraDiagnostics.ReplayGhost.cs'
      - 'OrbusRebornCamera/CameraDiagnostics.Recording.cs'
      - 'OrbusRebornCamera/CameraDiagnostics.ReplayViewer.cs'
      - 'OrbusRebornCamera/ReplayClipData.cs'
      - 'OrbusRebornCamera/OfflineWorldInventory.cs'
      - 'OrbusRebornCamera/CameraDiagnostics.OfflineLab.cs'
      - 'tests/OfflineWorldInventory.CompileTest.csproj'
      - 'tests/offline-world/**'
      - 'tests/ReplayClipReader.CompileTest.csproj'
      - 'tests/replay-viewer/**'
      - 'tests/ReplayRingBuffer.CompileTest.csproj'
      - 'tests/ReplayBuffer.IntegrationCompileTest.csproj'
      - 'tests/replay-buffer/**'
      - '.github/workflows/test-replay-buffer.yml'
  pull_request:
    paths:
      - 'OrbusRebornCamera/ReplayRingBuffer.cs'
      - 'OrbusRebornCamera/ReplayBufferRecorder.cs'
      - 'OrbusRebornCamera/NearbyWorldActorCapture.cs'
      - 'OrbusRebornCamera/WorldActorRecords.cs'
      - 'OrbusRebornCamera/WorldRigData.cs'
      - 'OrbusRebornCamera/WorldRigCapture.cs'
      - 'tests/WorldRigTimeline.CompileTest.csproj'
      - 'tests/world-rigs/**'
      - 'OrbusRebornCamera/CameraDiagnostics.WorldActors.cs'
      - 'tests/WorldActorTimeline.CompileTest.csproj'
      - 'tests/world-actors/**'
      - 'OrbusRebornCamera/LocalAvatarCapture.cs'
      - 'OrbusRebornCamera/CameraDiagnostics.ReplayGhost.cs'
      - 'OrbusRebornCamera/CameraDiagnostics.Recording.cs'
      - 'OrbusRebornCamera/CameraDiagnostics.ReplayViewer.cs'
      - 'OrbusRebornCamera/ReplayClipData.cs'
      - 'OrbusRebornCamera/OfflineWorldInventory.cs'
      - 'OrbusRebornCamera/CameraDiagnostics.OfflineLab.cs'
      - 'tests/OfflineWorldInventory.CompileTest.csproj'
      - 'tests/offline-world/**'
      - 'tests/ReplayClipReader.CompileTest.csproj'
      - 'tests/replay-viewer/**'
      - 'tests/ReplayRingBuffer.CompileTest.csproj'
      - 'tests/ReplayBuffer.IntegrationCompileTest.csproj'
      - 'tests/replay-buffer/**'
      - '.github/workflows/test-replay-buffer.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Run ring buffer tests (no game binaries required)
        run: |
          dotnet run --project tests/ReplayRingBuffer.CompileTest.csproj -c Release
          dotnet run --project tests/ReplayBuffer.IntegrationCompileTest.csproj -c Release
          dotnet run --project tests/ReplayClipReader.CompileTest.csproj -c Release
          dotnet run --project tests/WorldActorTimeline.CompileTest.csproj -c Release
          dotnet run --project tests/WorldRigTimeline.CompileTest.csproj -c Release
          dotnet run --project tests/OfflineWorldInventory.CompileTest.csproj -c Release
